services:
  llamafile:
    build: .
    container_name: llamafile-service
    ports:
      - "192.168.128.2:8080:8080"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "grep -i :1F90 /proc/net/tcp || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
